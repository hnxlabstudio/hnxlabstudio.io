<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2;url=https://wa.me/5582996677986?text=Ol%C3%A1%2C%20vim%20pelo%20instagram">
  <title>hnxlab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
    }
    .logo span { color: #25D366; }
    .msg {
      font-size: 0.95rem;
      color: #888;
      letter-spacing: 1px;
    }
    .dot-loader {
      display: flex;
      gap: 8px;
    }
    .dot-loader span {
      width: 8px;
      height: 8px;
      background: #25D366;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
    .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .manual {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #555;
    }
    .manual a {
      color: #25D366;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="logo">hnx<span>lab</span></div>
  <div class="msg">redirecionando para o whatsapp...</div>
  <div class="dot-loader">
    <span></span><span></span><span></span>
  </div>
  <div class="manual">
    não redirecionou? <a href="https://wa.me/5582996677986?text=Ol%C3%A1%2C%20vim%20pelo%20instagram">clique aqui</a>
  </div>

  <script>
    setTimeout(() => {
      window.location.replace("https://wa.me/5582996677986?text=Ol%C3%A1%2C%20vim%20pelo%20instagram");
    }, 2000);
  </script>
</body>
</html>
